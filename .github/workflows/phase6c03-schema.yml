name: C03-COMP-01 isolated schema review
on: [push, pull_request]
permissions:
  contents: read
jobs:
  schema-isolation:
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      FP6_TEST_PORT: '55453'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.29'
      - name: Install frozen schema dependencies
        run: uv sync --project backend --frozen
      - name: Frozen quality and immutable preservation
        working-directory: backend
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy
          uv run --frozen mypy provenance_migrations provenance_tests
          uv run --frozen python -m scripts.check_provenance_preservation
          uv run --frozen python -m scripts.check_indexing_preservation
      - name: Historical original-schema counterexample remains true
        working-directory: backend
        run: uv run --frozen pytest -q completion_tests/test_storage_compatibility.py
      - name: Explicit SQL suites and independent interruption and denial review
        working-directory: backend
        # Only db_tests (434 before + 434 after) and provenance_tests (93).
        # The independent controller adds four backend terminations and 18 denials.
        # No adapter import, application route, survivor or rule executor runs here.
        run: |
          mkdir -p ../.local/c03-comp01-ci
          set -o pipefail
          uv run --frozen python -u -m scripts.review_provenance_database 2>&1 | tee ../.local/c03-comp01-ci/database.log
      - name: Retain complete schema logs on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: c03-comp01-schema-${{ github.sha }}-${{ github.run_id }}
          path: .local/c03-comp01-ci/
          if-no-files-found: warn
