name: Phase 6C-02 disposable tenant database
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tenant-isolation:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      FP6_TEST_PORT: '55433'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11.9'
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.9.29'
      - name: Install frozen backend
        run: uv sync --project backend --frozen
      - name: Frozen lint and types
        working-directory: backend
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .
          uv run --frozen mypy
          uv run --frozen mypy db_tests
      - name: Protected historical and Phase 6C-01 bytes
        working-directory: backend
        run: uv run --frozen python -m scripts.check_phase6c02_preservation
      - name: Actual restricted roles and migration roundtrip
        working-directory: backend
        # Launcher generates four independent ephemeral secrets; none in GITHUB_ENV/artifacts.
        run: uv run --frozen python -m scripts.run_tenant_database
